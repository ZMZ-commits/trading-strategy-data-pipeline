name: Deploy (Hetzner)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'requirements.txt'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/zmz-commits/trading-strategy-data-pipeline
  # `latest`, not `prod`, and `pipeline`, not `data-pipeline-prod`.
  #
  # Both were wrong and had never been exercised -- this repo has no successful
  # workflow run. The compose stack names the service `pipeline` and pulls
  # `:latest`, so the deploy step reached for a service that does not exist and
  # a tag nothing consumes. It would have failed on the first push to main.
  #
  # There is one pipeline container platform-wide, because Alpaca's free tier
  # permits a single WebSocket stream. So there is no prod/stg/dev split to
  # encode in a tag here; dev and staging build without deploying (build.yml).
  TAG: latest
  SERVICE: pipeline

jobs:
  deploy:
    name: Build, push to ghcr, deploy the single pipeline container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ env.TAG }}-${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Hetzner VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u zmz-commits --password-stdin
            cd /opt/trading-platform/deploy
            docker compose pull ${{ env.SERVICE }}
            docker compose up -d ${{ env.SERVICE }}
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
